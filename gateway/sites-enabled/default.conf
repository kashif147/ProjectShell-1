            always;
        add_header 'Access-Control-Expose-Headers' 'X-Correlation-Id' always;
        add_header 'Access-Control-Max-Age' 86400 always;

        # Preflight
        if ($request_method = OPTIONS) {
            return 204;
        }


        limit_req zone=api_rate burst=50 nodelay;
        access_by_lua_file /etc/nginx/lua/verify_jwt.lua;

#       Disable cache for authenticated APIs
        proxy_no_cache $http_authorization;
        proxy_cache_bypass $http_authorization;

#       Add upstream retry tolerance

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        rewrite ^/subscription-service/(.*)$ /$1 break;
        proxy_pass http://subscription-service:4003/;
        proxy_http_version 1.1;
        proxy_set_header x-correlation-id $http_x_correlation_id;
