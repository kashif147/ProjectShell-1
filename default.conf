        access_by_lua_file /etc/nginx/lua/verify_jwt.lua;

        # Upstream must not add CORS; gateway server block already sets Access-Control-*
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;

        set $reporting_upstream http://reporting-service:4005;
        rewrite ^/reporting-service/(.*)$ /$1 break;
        proxy_pass $reporting_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
