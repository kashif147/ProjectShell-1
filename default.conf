    ###################################################################
    # Notification SERVICE
    ###################################################################

    location ^~ /notification-service/api/socket.io/ {
        # Auth is performed independently inside notification-service's own Socket.IO
        # io.use() middleware (jwt.verify against JWT_SECRET, never trusts gateway
        # headers - see Task 2 of the 2026-09-16 auth remediation for the full trace).
        # Running the full verify_jwt.lua here would be redundant and could reject
        # tokens the app itself would accept (stricter payload.id/tenantId requirement
        # vs the app's broader sub/id and tenantId/tid/extension_tenantId fallback).
        # This block only clears the same trusted headers every other location clears,
        # as defense-in-depth against a future refactor trusting them here too - it
        # does not perform any token verification of its own. Keep this list in sync
        # with verify_jwt.lua's own trusted_headers list by hand.
        access_by_lua_block {
            local trusted_headers = {
              "x-jwt-verified", "x-auth-source", "x-user-id", "x-tenant-id",
              "x-user-email", "x-user-type", "x-user-roles", "x-user-permissions",
              "x-token-expires-at", "x-service-caller",
              "x-gateway-signature", "x-gateway-timestamp", "x-service-secret",
            }
            for _, h in ipairs(trusted_headers) do
              ngx.req.clear_header(h)
            end
        }

        rewrite ^/notification-service/api/(.*)$ /$1 break;
        proxy_pass http://notification-service:4010/;
        proxy_http_version 1.1;
        proxy_set_header x-correlation-id $http_x_correlation_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
     }

    location ^~ /notification-service/api/ {

        # ---------------------------------------------------------
        # CORS HEADERS (APPLY TO ALL RESPONSES)
        # ---------------------------------------------------------
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods'
            'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'
            'Authorization, Content-Type, X-Requested-With, X-Correlation-Id, X-MS-TOKEN-AAD-ID-TOKEN, X-MS-TOKEN-AAD-ACCESS-TOKEN'
            always;
        add_header 'Access-Control-Expose-Headers' 'X-Correlation-Id' always;
        add_header 'Access-Control-Max-Age' 86400 always;

        # Preflight
        if ($request_method = OPTIONS) {
            return 204;
        }


        limit_req zone=api_rate burst=50 nodelay;
        access_by_lua_file /etc/nginx/lua/verify_jwt.lua;

#       Disable cache for authenticated APIs
        proxy_no_cache $http_authorization;
        proxy_cache_bypass $http_authorization;

#       Add upstream retry tolerance

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;

        rewrite ^/notification-service/(.*)$ /$1 break;
        proxy_pass http://notification-service:4010/;
        proxy_http_version 1.1;
        proxy_set_header x-correlation-id $http_x_correlation_id;
        proxy_set_header Connection "";
    }

