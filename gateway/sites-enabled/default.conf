    ###################################################################
    # ACCOUNT SERVICE – STRIPE WEBHOOK (NO JWT)
    ###################################################################
    location ^~ /account-service/api/webhook/stripe {

        # CORS is not required for Stripe, but harmless
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Stripe-Signature, X-Correlation-Id' always;

        # Preflight
        if ($request_method = OPTIONS) {
            return 204;
        }

        rewrite ^/account-service/(.*)$ /$1 break;
        proxy_pass http://account-service:4000;
        proxy_http_version 1.1;
        proxy_set_header x-correlation-id $http_x_correlation_id;
        proxy_set_header Connection "";
    }


    ###################################################################
    # ACCOUNTS SERVICE
    ###################################################################

    location ^~ /account-service/api/ {

        # ---------------------------------------------------------
        # CORS HEADERS (APPLY TO ALL RESPONSES)
        # ---------------------------------------------------------
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods'
            'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'
            'Authorization, Content-Type, X-Requested-With, X-Correlation-Id, X-MS-TOKEN-AAD-ID-TOKEN, X-MS-TOKEN-AAD-ACCESS-TOKEN, X-IDEMPOTENCY-KEY'
            always;
        add_header 'Access-Control-Expose-Headers' 'X-Correlation-Id' always;
        add_header 'Access-Control-Max-Age' 86400 always;

        # Preflight
        if ($request_method = OPTIONS) {
            return 204;
        }
        
        limit_req zone=api_rate burst=50 nodelay;
        access_by_lua_file /etc/nginx/lua/verify_jwt.lua;

#       Disable cache for authenticated APIs
        proxy_no_cache $http_authorization;
        proxy_cache_bypass $http_authorization;

#       Add upstream retry tolerance

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;

# Force a trailing slash before proxying.
#        if ($request_uri ~ ^(/account-service/api/.+[^/])$) {
#            return 308 $1/;
#        }

        rewrite ^/account-service/(.*)$ /$1 break;
        proxy_pass http://account-service:4000/;
        proxy_http_version 1.1;
        proxy_set_header x-correlation-id $http_x_correlation_id;
        proxy_set_header Connection "";
    }

