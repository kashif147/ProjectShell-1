map $http_origin $cors_origin {
    default "";

    "http://localhost:3000"                   $http_origin;
    "https://project-shell-crm-dev.vercel.app"    $http_origin;

    "http://localhost:3001"                   $http_origin;
    "https://project-shell-portal-dev.vercel.app" $http_origin;
}


###################################################################
# HTTP → HTTPS REDIRECT
###################################################################
server {
    listen 80;
    server_name projectshell-vm.northeurope.cloudapp.azure.com;
    
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name projectshell-vm.northeurope.cloudapp.azure.com;

    resolver 127.0.0.11 valid=10s ipv6=off;

    ###################################################################
    # SSL CONFIG (Let's Encrypt)
    ###################################################################
    ssl_certificate     /etc/letsencrypt/live/projectshell-vm.northeurope.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/projectshell-vm.northeurope.cloudapp.azure.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;

    # ------------------------------------------------------------------
    # GLOBAL PROXY HEADERS
    # ------------------------------------------------------------------
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    #proxy_set_header X-Forwarded-Proto $scheme;

    # Authorization header MUST be forwarded
    proxy_set_header Authorization $http_authorization;

    # Correlation ID for logging-lib / distributed tracing (forward client header if present)
    proxy_set_header x-correlation-id $http_x_correlation_id;

    # ------------------------------------------------------------------
    # TRUSTED HEADERS - STRIPPED ON EVERY LOCATION OF THIS SERVER
    # A client must never supply x-jwt-verified / x-auth-source / x-user-* / x-tenant-id /
    # x-internal-request etc. (list: lua/trusted_headers.lua). Every location WITHOUT its own
    # access_by_lua* inherits this block (public /user-service/auth/ and /pkce/, webhooks, n8n,
    # rabbitmq, health). Locations running verify_jwt.lua replace it; that script clears the same
    # list first and then sets the values from a verified ProjectShell JWT.
    # ------------------------------------------------------------------
    access_by_lua_block {
        require("trusted_headers").clear()
    }

    ###################################################################
    # USER SERVICE – AUTH ENDPOINTS (PUBLIC, NO JWT, NO POLICY)
    ###################################################################

    # 0B-6: general-CRM auth routes are not part of the INMO demo (Entra/B2C only).
    # Exact-match locations take precedence over the /user-service/auth/ prefix below.
    location = /user-service/auth/general-crm/register { return 404; }
    location = /user-service/auth/general-crm/login    { return 404; }

    # Logout is the one PROTECTED auth endpoint: it acts on the signed-in user, so it requires a
    # verified ProjectShell JWT here (exact match wins over the public /user-service/auth/ prefix).
    # The identity user-service sees comes only from that token, never from request headers.
    location = /user-service/auth/logout {
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods'
            'GET, POST, PUT, PATCH, DELETE, OPTIONS'
            always;
        add_header 'Access-Control-Allow-Headers'
            'Authorization, Content-Type, X-Requested-With, X-Correlation-Id, X-MS-TOKEN-AAD-ID-TOKEN, X-MS-TOKEN-AAD-ACCESS-TOKEN'
            always;
        add_header 'Access-Control-Expose-Headers' 'X-Correlation-Id' always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        access_by_lua_file /etc/nginx/lua/verify_jwt.lua;

        rewrite ^/user-service/(.*)$ /$1 break;
        proxy_pass http://user-service:5001;
        proxy_http_version 1.1;
        proxy_set_header x-correlation-id $http_x_correlation_id;
        proxy_set_header Connection "";
    }

    location ^~ /user-service/auth/ {

        # ---------------------------------------------------------
        # CORS HEADERS – MUST ALWAYS BE PRESENT
        # ---------------------------------------------------------
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods'
            'GET, POST, PUT, PATCH, DELETE, OPTIONS'
            always;
        add_header 'Access-Control-Allow-Headers'
            'Authorization, Content-Type, X-Requested-With, X-Correlation-Id, X-MS-TOKEN-AAD-ID-TOKEN, X-MS-TOKEN-AAD-ACCESS-TOKEN'
            always;
        add_header 'Access-Control-Expose-Headers' 'X-Correlation-Id' always;

        # ---------------------------------------------------------
        # PRE-FLIGHT MUST SHORT CIRCUIT
        # ---------------------------------------------------------
        if ($request_method = OPTIONS) {
            return 204;
        }

        # ---------------------------------------------------------
        # IMPORTANT
        # - No access_by_lua_file here
        # - Auth bootstrap happens BEFORE JWT exists
        # - Trusted headers are still stripped (inherited server-level block)
        # - /user-service/auth/logout is NOT public: see its exact location above
        # ---------------------------------------------------------
        rewrite ^/user-service/(.*)$ /$1 break;
        proxy_pass http://user-service:5001;
        proxy_http_version 1.1;
        proxy_set_header x-correlation-id $http_x_correlation_id;
        proxy_set_header Connection "";
    }

    ###################################################################
    # USER SERVICE – PKCE ENDPOINTS (PUBLIC, NO JWT, NO POLICY)
    ###################################################################

    location ^~ /user-service/pkce/ {

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods'
            'GET, POST, PUT, PATCH, DELETE, OPTIONS'
            always;
        add_header 'Access-Control-Allow-Headers'
            'Authorization, Content-Type, X-Requested-With, X-Correlation-Id, X-MS-TOKEN-AAD-ID-TOKEN, X-MS-TOKEN-AAD-ACCESS-TOKEN'
            always;
        add_header 'Access-Control-Expose-Headers' 'X-Correlation-Id' always;
        add_header 'Access-Control-Max-Age' 86400 always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # PKCE is required before a JWT exists, so no JWT validation here
        # (trusted headers are still stripped by the inherited server-level block)

        rewrite ^/user-service/(.*)$ /$1 break;

        proxy_pass http://user-service:5001;
        proxy_http_version 1.1;

        proxy_set_header x-correlation-id $http_x_correlation_id;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
    }


    ###################################################################
    # USER SERVICE – PROTECTED API (JWT REQUIRED)
    ###################################################################

    # 1C-2A: legacy local register/login trusted a caller-supplied tenantId (cross-tenant account
    # creation + token issuance). Exact-match locations take precedence over the prefix below.
    location = /user-service/api/users/register { return 404; }
    location = /user-service/api/users/login    { return 404; }

    # Azure B2C API connector ("Before creating the user"): public, NO ProjectShell JWT, exact path
    # only - nothing else under /user-service/api/ becomes public. Azure B2C authenticates with HTTP
    # Basic auth, which user-service checks (middlewares/basicAuth.middleware.js; fails closed when
    # credentials are not configured). No access_by_lua here, so the server-level block strips every
    # client-supplied trusted header (x-tenant-id, x-internal-request, x-user-*, ...): user-service
    # resolves the tenant from the B2C client_id and then calls profile-service itself as a genuine
    # internal request. profile-service's /api/profile/validate is NOT public.
    location = /user-service/api/users/validate {
        limit_except POST { deny all; }
        client_max_body_size 16k;
        limit_req zone=b2c_connector burst=20 nodelay;

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        rewrite ^/user-service/(.*)$ /$1 break;
        proxy_pass http://user-service:5001;
        proxy_http_version 1.1;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header x-correlation-id $http_x_correlation_id;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /user-service/api/ {

        # ---------------------------------------------------------
        # CORS HEADERS
        # ---------------------------------------------------------
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods'
            'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'
            'Authorization, Content-Type, X-Requested-With, X-Correlation-Id, X-MS-TOKEN-AAD-ID-TOKEN, X-MS-TOKEN-AAD-ACCESS-TOKEN'
            always;
        add_header 'Access-Control-Expose-Headers' 'X-Correlation-Id' always;
        add_header 'Access-Control-Max-Age' 86400 always;

        # ---------------------------------------------------------
        # PRE-FLIGHT
        # ---------------------------------------------------------
        if ($request_method = OPTIONS) {
            return 204;
        }

        # ---------------------------------------------------------
        # RATE LIMITING
        # ---------------------------------------------------------
        limit_req zone=api_rate burst=50 nodelay;

        # ---------------------------------------------------------
        # JWT VERIFICATION
        # ---------------------------------------------------------
        access_by_lua_file /etc/nginx/lua/verify_jwt.lua;

        # ---------------------------------------------------------
        # DISABLE CACHE FOR AUTHENTICATED REQUESTS
        # ---------------------------------------------------------
        proxy_no_cache $http_authorization;
        proxy_cache_bypass $http_authorization;

        # ---------------------------------------------------------
        # UPSTREAM RESILIENCE
        # ---------------------------------------------------------
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;

        rewrite ^/user-service/(.*)$ /$1 break;
        proxy_pass http://user-service:5001/;
        proxy_http_version 1.1;

        # ---------------------------------------------------------
        # FORWARD TRUSTED GATEWAY HEADERS
        # ---------------------------------------------------------
        proxy_set_header x-jwt-verified        $http_x_jwt_verified;
        proxy_set_header x-gateway-signature  $http_x_gateway_signature;
        proxy_set_header x-gateway-timestamp  $http_x_gateway_timestamp;
        proxy_set_header x-user-id             $http_x_user_id;
        proxy_set_header x-tenant-id           $http_x_tenant_id;
        proxy_set_header x-user-roles          $http_x_user_roles;
        proxy_set_header x-user-permissions    $http_x_user_permissions;
        proxy_set_header x-token-expires-at    $http_x_token_expires_at;
        proxy_set_header x-auth-source         $http_x_auth_source;

        proxy_set_header x-correlation-id $http_x_correlation_id;
        proxy_set_header Connection "";

        proxy_cache api_cache;
        proxy_cache_methods GET HEAD;
        add_header X-Cache-Status $upstream_cache_status;
    }

    ###################################################################
    # PORTAL SERVICE (JWT + POLICY)
    ###################################################################
    location ^~ /portal-service/api/ {

        # ---------------------------------------------------------
        # CORS HEADERS
