map $http_origin $cors_origin {
    default "";

    "http://localhost:3000"                   $http_origin;
    "http://localhost:3001"                   $http_origin;
    "https://project-shell-crm.vercel.app"    $http_origin;
    "https://project-shell-portal.vercel.app" $http_origin;
}


###################################################################
# HTTP → HTTPS REDIRECT
###################################################################
server {
    listen 80;
    server_name projectshell-vm.northeurope.cloudapp.azure.com;
    
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name projectshell-vm.northeurope.cloudapp.azure.com;

    resolver 127.0.0.11 valid=10s ipv6=off;

    ###################################################################
    # SSL CONFIG (Let's Encrypt)
    ###################################################################
    ssl_certificate     /etc/letsencrypt/live/projectshell-vm.northeurope.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/projectshell-vm.northeurope.cloudapp.azure.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;

    # ------------------------------------------------------------------
    # GLOBAL PROXY HEADERS
    # ------------------------------------------------------------------
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    #proxy_set_header X-Forwarded-Proto $scheme;

    # Authorization header MUST be forwarded
    proxy_set_header Authorization $http_authorization;

    # Correlation ID for logging-lib / distributed tracing (forward client header if present)
    proxy_set_header x-correlation-id $http_x_correlation_id;

    ###################################################################
    # USER SERVICE – AUTH ENDPOINTS (PUBLIC, NO JWT, NO POLICY)
    ###################################################################

    location ^~ /user-service/auth/ {

        # ---------------------------------------------------------
        # CORS HEADERS – MUST ALWAYS BE PRESENT
        # ---------------------------------------------------------
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods'
            'GET, POST, PUT, PATCH, DELETE, OPTIONS'
            always;
        add_header 'Access-Control-Allow-Headers'
            'Authorization, Content-Type, X-Requested-With, X-Correlation-Id, X-MS-TOKEN-AAD-ID-TOKEN, X-MS-TOKEN-AAD-ACCESS-TOKEN'
            always;
        add_header 'Access-Control-Expose-Headers' 'X-Correlation-Id' always;

        # ---------------------------------------------------------
        # PRE-FLIGHT MUST SHORT CIRCUIT
        # ---------------------------------------------------------
        if ($request_method = OPTIONS) {
            return 204;
        }

        # ---------------------------------------------------------
        # IMPORTANT
        # - No access_by_lua_file here
        # - Auth bootstrap happens BEFORE JWT exists
        # ---------------------------------------------------------
        rewrite ^/user-service/(.*)$ /$1 break;
        proxy_pass http://user-service:5001;
        proxy_http_version 1.1;
        proxy_set_header x-correlation-id $http_x_correlation_id;
        proxy_set_header Connection "";
    }

    ###################################################################
    # USER SERVICE – PROTECTED API (JWT REQUIRED)
    ###################################################################
    location ^~ /user-service/api/ {

        # ---------------------------------------------------------
        # CORS HEADERS
        # ---------------------------------------------------------
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods'
            'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'
            'Authorization, Content-Type, X-Requested-With, X-Correlation-Id, X-MS-TOKEN-AAD-ID-TOKEN, X-MS-TOKEN-AAD-ACCESS-TOKEN'
            always;
        add_header 'Access-Control-Expose-Headers' 'X-Correlation-Id' always;
        add_header 'Access-Control-Max-Age' 86400 always;

        # ---------------------------------------------------------
        # PRE-FLIGHT
        # ---------------------------------------------------------
        if ($request_method = OPTIONS) {
            return 204;
        }

        # ---------------------------------------------------------
        # RATE LIMITING
        # ---------------------------------------------------------
        limit_req zone=api_rate burst=50 nodelay;

        # ---------------------------------------------------------
        # JWT VERIFICATION
        # ---------------------------------------------------------
        access_by_lua_file /etc/nginx/lua/verify_jwt.lua;

        # ---------------------------------------------------------
        # DISABLE CACHE FOR AUTHENTICATED REQUESTS
        # ---------------------------------------------------------
        proxy_no_cache $http_authorization;
        proxy_cache_bypass $http_authorization;

        # ---------------------------------------------------------
        # UPSTREAM RESILIENCE
        # ---------------------------------------------------------
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;

        rewrite ^/user-service/(.*)$ /$1 break;
        proxy_pass http://user-service:5001/;
        proxy_http_version 1.1;

        # ---------------------------------------------------------
        # FORWARD TRUSTED GATEWAY HEADERS
        # ---------------------------------------------------------
        proxy_set_header x-jwt-verified        $http_x_jwt_verified;
        proxy_set_header x-gateway-signature  $http_x_gateway_signature;
        proxy_set_header x-gateway-timestamp  $http_x_gateway_timestamp;
        proxy_set_header x-user-id             $http_x_user_id;
        proxy_set_header x-tenant-id           $http_x_tenant_id;
        proxy_set_header x-user-roles          $http_x_user_roles;
        proxy_set_header x-user-permissions    $http_x_user_permissions;
        proxy_set_header x-token-expires-at    $http_x_token_expires_at;
        proxy_set_header x-auth-source         $http_x_auth_source;

        proxy_set_header x-correlation-id $http_x_correlation_id;
        proxy_set_header Connection "";

        proxy_cache api_cache;
        proxy_cache_methods GET HEAD;
        add_header X-Cache-Status $upstream_cache_status;
    }

    ###################################################################
    # INTERNAL — Microsoft token verification subrequest target for
    # config/verify_jwt.lua's RS256 branch. `internal;` means this location
    # can only be reached via ngx.location.capture from within this nginx
    # instance, never by a direct external request - the shared-secret
    # check (x-service-secret / GATEWAY_VERIFY_SECRET) in
    # backend/user-service/controllers/internalMsTokenVerification.controller.js
    # is a second, independent layer on top of that. Deliberately does NOT
    # declare access_by_lua_file: this location must not re-run
    # verify_jwt.lua (that would recurse back into this same subrequest).
    ###################################################################
    location = /_internal/verify-ms-token {
        internal;

        proxy_pass http://user-service:5001/api/internal/verify-ms-token;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    ###################################################################
    # PORTAL SERVICE (JWT + POLICY)
    ###################################################################
    location ^~ /portal-service/api/ {

        # ---------------------------------------------------------
        # CORS HEADERS
        # ---------------------------------------------------------
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods'
            'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'
            'Authorization, Content-Type, X-Requested-With, X-Correlation-Id, X-MS-TOKEN-AAD-ID-TOKEN, X-MS-TOKEN-AAD-ACCESS-TOKEN'
            always;
        add_header 'Access-Control-Expose-Headers' 'X-Correlation-Id' always;
        add_header 'Access-Control-Max-Age' 86400 always;

        # ---------------------------------------------------------
        # PRE-FLIGHT
        # ---------------------------------------------------------
        if ($request_method = OPTIONS) {
            return 204;
        }

        limit_req zone=api_rate burst=50 nodelay;
        access_by_lua_file /etc/nginx/lua/verify_jwt.lua;

        # Disable cache
        proxy_no_cache $http_authorization;
        proxy_cache_bypass $http_authorization;

        # Retry tolerance
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;

        rewrite ^/portal-service/(.*)$ /$1 break;
        proxy_pass http://portal-service:4001/;
        proxy_http_version 1.1;
        proxy_set_header x-correlation-id $http_x_correlation_id;
        proxy_set_header Connection "";
    }

