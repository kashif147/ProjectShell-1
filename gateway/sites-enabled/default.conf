    }

    ###################################################################
    # n8n Dashboards
    ###################################################################
    location /n8n/ {
        auth_basic "Restricted Area";
        auth_basic_user_file /etc/nginx/n8n.htpasswd;

        rewrite ^/n8n/?(.*)$ /$1 break;

        proxy_pass http://n8n:5678/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header x-correlation-id $http_x_correlation_id;

	#added Authroization today 30122025
	proxy_set_header Authorization "";

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /n8n/static/ {
        rewrite ^/n8n/static/(.*)$ /static/$1 break;
        proxy_pass http://n8n:5678;
    }

    location /n8n/assets/ {
        rewrite ^/n8n/assets/(.*)$ /assets/$1 break;
        proxy_pass http://n8n:5678;
    }

    ###################################################################
    # RabbitMQ Dashboard
    ###################################################################
    location /rabbitmq/ {

#    	auth_basic "Restricted RabbitMQ";
#    	auth_basic_user_file /etc/nginx/rabbitmq.htpasswd;

        rewrite ^/rabbitmq/(.*)$ /$1 break;

        proxy_pass http://rabbitmq:15672/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#        proxy_set_header X-Forwarded-Proto $scheme; 
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header x-correlation-id $http_x_correlation_id;

        #added Authroization today 30122025
	proxy_set_header Authorization "";

    }

   ###################################################################
    # AUDIT SERVICE
    ###################################################################
    location = /audit-service/health {
        set $audit_health_upstream http://audit-service:4006;
        rewrite ^/audit-service/(.*)$ /$1 break;
        proxy_pass $audit_health_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location ^~ /audit-service/api/ {
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods'
            'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'
            'Authorization, Content-Type, X-Requested-With, X-Correlation-Id, X-Tenant-Id, X-MS-TOKEN-AAD-ID-TOKEN, X-MS-TOKEN-AAD-ACCESS-TOKEN'
            always;
        add_header 'Access-Control-Expose-Headers' 'X-Correlation-Id' always;
        add_header 'Access-Control-Max-Age' 86400 always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        limit_req zone=api_rate burst=50 nodelay;
        access_by_lua_file /etc/nginx/lua/verify_jwt.lua;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;

        proxy_no_cache $http_authorization;
        proxy_cache_bypass $http_authorization;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;

        set $audit_upstream http://audit-service:4006;
        rewrite ^/audit-service/(.*)$ /$1 break;
        proxy_pass $audit_upstream;
        proxy_http_version 1.1;

        proxy_set_header x-jwt-verified $http_x_jwt_verified;
        proxy_set_header x-gateway-signature $http_x_gateway_signature;
        proxy_set_header x-gateway-timestamp $http_x_gateway_timestamp;
        proxy_set_header x-user-id $http_x_user_id;
        proxy_set_header x-tenant-id $http_x_tenant_id;
        proxy_set_header x-user-roles $http_x_user_roles;
        proxy_set_header x-user-permissions $http_x_user_permissions;
        proxy_set_header x-token-expires-at $http_x_token_expires_at;
        proxy_set_header x-auth-source $http_x_auth_source;

        proxy_set_header x-correlation-id $http_x_correlation_id;
        proxy_set_header Connection "";
    }

    ###################################################################
