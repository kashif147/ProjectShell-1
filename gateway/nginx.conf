env JWT_SECRET;
env GATEWAY_SECRET;
env GATEWAY_VERIFY_SECRET;
env NOTIFIER_APP_ID;

env AZURE_TENANT_ID;
env BACKEND_API_APP_ID;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ---------------------------------------------------------
    # REQUIRED for Lua HTTP (Azure JWKS fetch)
    # ---------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    include       mime.types;
    default_type  application/octet-stream;

    # REQUIRED for Lua HTTPS (Azure JWKS)
    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    lua_ssl_verify_depth 5;

    map $http_origin $cors_origin {
        default "";

        # CRM
        "http://localhost:3000"                 $http_origin;
        "https://project-shell-crm.vercel.app"  $http_origin;
        "https://project-shell-crm-dev.vercel.app" $http_origin;

        # Portal
        "http://localhost:3001"                 $http_origin;
        "https://project-shell-portal.vercel.app" $http_origin;
        "https://project-shell-portal-dev.vercel.app" $http_origin;
    }

    sendfile on;
    keepalive_timeout 65;

    # ---------------------------------------------------------
    # JWT Cache (used by jwt.lua)
    # ---------------------------------------------------------
    lua_shared_dict jwt_cache 10m;
    lua_package_path "/etc/nginx/lua/?.lua;;";

    # ---------------------------------------------------------
    # GLOBAL API CACHE (single definition only)
    # ---------------------------------------------------------
    proxy_cache_path /var/cache/nginx
                     levels=1:2
                     keys_zone=api_cache:50m
                     max_size=200m
                     inactive=10m
                     use_temp_path=off;

    # ---------------------------------------------------------
    # RATE LIMITING ZONE
    # ---------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_rate:50m rate=5r/s;

    # ---------------------------------------------------------
    # Load all service configs
    # ---------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}

