        proxy_cache_bypass $http_authorization;

#       Add upstream retry tolerance

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;

	set $reporting_upstream http://reporting-service:4005;
        rewrite ^/reporting-service/(.*)$ /$1 break;
        proxy_pass $reporting_upstream;

        proxy_http_version 1.1;
        proxy_set_header x-correlation-id $http_x_correlation_id;
        proxy_set_header Connection "";
    }

    ###################################################################
    # Notification SERVICE
    ###################################################################

    location ^~ /notification-service/api/socket.io/ {
        access_log logs/access.log socketio_safe; # no query string (Socket.IO auth hardening)
        # Auth is performed independently inside notification-service's own Socket.IO
        # io.use() middleware (jwt.verify against JWT_SECRET, never trusts gateway
        # headers - see Task 2 of the 2026-09-16 auth remediation for the full trace).
        # Running the full verify_jwt.lua here would be redundant and could reject
        # tokens the app itself would accept (stricter payload.id/tenantId requirement
        # vs the app's broader sub/id and tenantId/tid/extension_tenantId fallback).
        # This block only clears the trusted headers (shared list: lua/trusted_headers.lua),
        # as defense-in-depth against a future refactor trusting them here too - it
        # does not perform any token verification of its own.
        access_by_lua_block {
            require("trusted_headers").clear()
        }

        rewrite ^/notification-service/api/(.*)$ /$1 break;
        proxy_pass http://notification-service:4010/;
        proxy_http_version 1.1;
        proxy_set_header x-correlation-id $http_x_correlation_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
     }

    location ^~ /notification-service/api/ {

        # ---------------------------------------------------------
